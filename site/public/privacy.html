<h1>Privacy</h1>
<p>Alterly reads table statistics (row counts, sizes and index lists) through a read-only database role, and the migration files in pull requests you give it access to. It never reads rows from your tables.</p><p><a href="mailto:hello@alterly.example">Email us</a> with any question about your data.</p>
